worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------
    # 🚨 FIX: UPSTREAM BLOCK IS NOW CORRECTLY HERE!
    # ------------------------------------------------
    upstream fastapi_backend {
        # Use the service name defined in docker-compose.yml
        server app:8000; 
    }
    
    server {
        listen 80; # NGINX listens on port 80
        server_name localhost;

        location / {
            # Proxy the request to the Uvicorn server
            proxy_pass http://fastapi_backend; # <-- Refers to the upstream name
            
            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: Proxy to the /docs endpoint directly for convenience
        location /docs {
            proxy_pass http://fastapi_backend/docs;
        }
    }
}